# =============================================
#  LogiTrack - Perfil MySQL
#  Activar con: --spring.profiles.active=mysql
#
#  Ajuste username/password según su instalación.
# =============================================

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Desactivar H2
spring.h2.console.enabled=false

# JWT (igual que el perfil por defecto)
jwt.secret=logitrack-clave-secreta-para-firmar-tokens-jwt-de-al-menos-256-bits
jwt.expiration=86400000
