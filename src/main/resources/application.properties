# =============================================
#  LogiTrack - Configuración por defecto (H2)
#  Sin instalación: arranca con base de datos en memoria H2.
#  Para usar MySQL: --spring.profiles.active=mysql
# =============================================
server.port=8080
spring.application.name=logitrack

# ---------------------------------------------
#  Base de datos H2 en memoria (por defecto)
# ---------------------------------------------
spring.datasource.url=jdbc:h2:mem:logitrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------
#  JPA / Hibernate
# ---------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ---------------------------------------------
#  JWT
# ---------------------------------------------
jwt.secret=logitrack-clave-secreta-para-firmar-tokens-jwt-de-al-menos-256-bits
jwt.expiration=86400000

# ---------------------------------------------
#  Springdoc / Swagger
# ---------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.logitracksa.project.controller

# ---------------------------------------------
#  Logging
# ---------------------------------------------
logging.level.com.logitracksa=DEBUG
